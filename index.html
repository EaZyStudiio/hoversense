<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>HoverSense - Spatial Hover Demo Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1e2b;
    --paper:#eef0f6;
    --panel:#ffffff;
    --line:#c9cddd;
    --muted:#5d6479;
    --screen:#0e7c86;      /* screen-position channel */
    --touch:#5b46d9;       /* touch-position channel */
    --dead:#8a8fa3;        /* safe / ignored zone */
    --fg:var(--ink);
    --bg:var(--paper);
    --accent:#5b46d9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e7e9f2; --paper:#12151f; --panel:#1a1e2b; --line:#2e3446; --muted:#8e96ad;
      --screen:#3fd1cf; --touch:#9b8cff; --dead:#5a6076; --accent:#9b8cff;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e7e9f2; --paper:#12151f; --panel:#1a1e2b; --line:#2e3446; --muted:#8e96ad;
    --screen:#3fd1cf; --touch:#9b8cff; --dead:#5a6076; --accent:#9b8cff;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  /* Stage: touch-action:pan-y keeps native vertical scrolling while killing double-tap zoom */
  #stage{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    touch-action:pan-y;
    padding:0 14px 68vh;
  }

  .card{
    position:relative; border:1px solid var(--line); border-radius:12px;
    background:var(--panel); padding:14px 16px; overflow:hidden;
    transition:transform 90ms linear, box-shadow 90ms linear, border-color 90ms linear;
  }
  .card .idx{font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1}
  .card .meta{color:var(--muted);font-size:11px;margin-top:6px;font-weight:500}
  .card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}

  .stack{display:flex;flex-direction:column;gap:12px}
  .cols{display:flex;gap:12px;align-items:flex-start}
  .col{flex:1;display:flex;flex-direction:column;gap:12px}
  .portrait{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .grid3 .card{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .grid3 .card .idx{font-size:22px}

  /* fixed chrome */
  .hud{
    position:fixed;left:8px;right:8px;top:8px;z-index:40;
    background:color-mix(in srgb,var(--panel) 90%,transparent);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;padding:8px 12px;
    font-size:11px;
    box-shadow:0 4px 16px rgba(0,0,0,0.06);
  }
  .hud-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .kv{display:flex;gap:5px;align-items:baseline}
  .kv b{font-weight:600;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:0.04em}
  .dock{
    position:fixed;left:8px;right:8px;bottom:8px;z-index:40;
    background:color-mix(in srgb,var(--panel) 94%,transparent);
    backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:14px;padding:10px;
    max-height:50vh;overflow-y:auto;
    box-shadow:0 -4px 24px rgba(0,0,0,0.08);
  }
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{
    font:inherit;font-size:12px;font-weight:500;padding:7px 11px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;
    touch-action:manipulation;
    transition:background 120ms ease, border-color 120ms ease, transform 60ms ease;
  }
  button:active{transform:scale(0.97)}
  button[data-on="1"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  button.ch-screen[data-on="1"]{background:var(--screen);border-color:var(--screen);color:#04121a}
  button.ch-touch[data-on="1"]{background:var(--touch);border-color:var(--touch);color:#fff}
  button.btn-guide{border-color:var(--accent);color:var(--accent);font-weight:600}

  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
  .sl{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);touch-action:none}
  .sl-header{display:flex;justify-content:space-between;align-items:center;user-select:none}
  .sl-header span{font-weight:500;color:var(--fg)}

  /* Custom Touch-Friendly Draggable Slider Tracks */
  .custom-track{
    position:relative;
    width:100%;
    height:28px;
    display:flex;
    align-items:center;
    cursor:pointer;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .custom-bar{
    width:100%;
    height:6px;
    border-radius:3px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  .custom-fill{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    background:var(--accent);
    border-radius:3px;
  }
  .custom-thumb{
    position:absolute;
    width:20px;
    height:20px;
    margin-left:-10px;
    border-radius:50%;
    background:var(--panel);
    border:2.5px solid var(--accent);
    box-shadow:0 2px 8px rgba(0,0,0,0.22);
    pointer-events:none;
    transition:transform 80ms ease;
  }
  .custom-track:active .custom-thumb{
    transform:scale(1.18);
  }

  details{margin-top:8px}
  details>summary{cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}

  /* Center-of-screen Floating HUD Readout (Never covered by fingers!) */
  .center-readout{
    position:fixed;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:60;
    pointer-events:none;
    background:color-mix(in srgb, var(--panel) 96%, transparent);
    backdrop-filter:blur(16px);
    border:1.5px solid var(--accent);
    border-radius:16px;
    padding:14px 20px;
    text-align:center;
    box-shadow:0 12px 36px rgba(0,0,0,0.18);
    min-width:240px;
    max-width:88vw;
    animation:fadeIn 120ms ease-out;
  }
  .center-readout .cr-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)}
  .center-readout .cr-val{font-size:32px;font-weight:700;color:var(--accent);line-height:1.1;margin:4px 0}
  .center-readout .cr-desc{font-size:11px;color:var(--fg);opacity:0.88;line-height:1.4}

  /* Explanation Guide Modal */
  .modal-backdrop{
    position:fixed;inset:0;z-index:80;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    animation:fadeIn 150ms ease-out;
  }
  .modal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    max-width:520px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:0 20px 48px rgba(0,0,0,0.25);
  }
  .modal-card h2{margin:0 0 8px;font-size:18px;font-weight:700}
  .modal-card p{margin:0 0 14px;font-size:12px;line-height:1.5;color:var(--muted)}
  .guide-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .guide-item{background:color-mix(in srgb,var(--paper) 60%,transparent);border-radius:10px;padding:10px 12px;font-size:11px}
  .guide-item b{color:var(--fg);display:block;margin-bottom:2px;font-size:12px}
  .guide-note{background:color-mix(in srgb,var(--touch) 12%,transparent);border:1px solid var(--touch);border-radius:10px;padding:10px 12px;font-size:11px;margin-bottom:16px;line-height:1.4}
  .btn-close{width:100%;padding:10px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-weight:600;font-size:13px;cursor:pointer}

  @keyframes fadeIn {
    from{opacity:0;transform:translate(-50%,-46%)}
    to{opacity:1;transform:translate(-50%,-50%)}
  }

  /* overlays */
  .anchor{position:fixed;left:0;right:0;height:0;z-index:30;pointer-events:none;
    border-top:1px dashed var(--screen)}
  .anchor span{position:absolute;right:8px;top:-16px;font-size:10px;font-weight:600;color:var(--screen)}
  .band{position:fixed;left:0;right:0;z-index:29;pointer-events:none}
  .zone{position:fixed;z-index:28;pointer-events:none}
  .dot{position:fixed;z-index:35;pointer-events:none;width:18px;height:18px;margin:-9px 0 0 -9px;
    border-radius:50%;border:2px solid var(--touch)}
  .dot i{position:absolute;inset:3px;border-radius:50%;background:var(--touch)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo, useCallback } = React;

/* ============================================================================
   HoverSense Pure Mathematics Module
   ==========================================================================*/

const clamp = (v, lo, hi) => {
  const actualLo = Math.min(lo, hi);
  const actualHi = Math.max(lo, hi);
  return Math.min(Math.max(v, actualLo), actualHi);
};
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { const x = clamp(t, 0, 1); return x * x * (3 - 2 * x); };

function distToRect(pt, r) {
  const minX = Math.min(r.left, r.right);
  const maxX = Math.max(r.left, r.right);
  const minY = Math.min(r.top, r.bottom);
  const maxY = Math.max(r.top, r.bottom);
  const dx = Math.max(0, minX - pt.x, pt.x - maxX);
  const dy = Math.max(0, minY - pt.y, pt.y - maxY);
  return Math.hypot(dx, dy);
}

const DEFAULTS = {
  screen: {
    anchorRatio: 0.42,
    bandRatio: 0.30,
    resolve: 'all',
    rowSplit: 0.0,
  },
  touch: {
    holdMsMin: 320,
    holdMsMax: 1200,
    dragDeadzonePx: 9,
    dragFullPx: 46,
    verticalDragWeight: 0.22,
    scrollLockGraceMs: 220,
    scrollLockAxisRatio: 1.3,
    engageAt: 0.90, // Recommended default 90%
    tapMaxMs: 180,
    tapMaxMovePx: 10,
    outerFalloffPx: 42,
    inBetweenRatio: 0.40,
    clearLatchOnTap: false,
  },
  arbitration: {
    takeoverStartPx: 180,
    takeoverFullPx: 560,
    releaseMode: 'off-screen',
  },
  safeZones: [
    { id:'thumb-rest', left:0, right:1, top:0.80, bottom:1.00, weight:0.00, featherPx:110 },
    { id:'edge-left',  left:0, right:0.07, top:0, bottom:1, weight:0.25, featherPx:40 },
    { id:'edge-right', left:0.93, right:1, top:0, bottom:1, weight:0.25, featherPx:40 },
    { id:'top-chrome', left:0, right:1, top:0, bottom:0.09, weight:0.00, featherPx:50 },
  ],
};

function zonePenetration(pt, z, vw, vh) {
  const safeVw = Math.max(1, vw);
  const safeVh = Math.max(1, vh);
  const l = z.left * safeVw, r = z.right * safeVw, t = z.top * safeVh, b = z.bottom * safeVh;
  const f = Math.max(1, z.featherPx ?? 60);
  const d = Math.min(pt.x - l, r - pt.x, pt.y - t, b - pt.y);
  return smooth((d + f / 2) / f);
}

function sampleZones(pt, zones, vw, vh) {
  let weight = 1, hit = null;
  if (!zones || zones.length === 0) return { weight: 1.0, zoneId: null };
  for (const z of zones) {
    const p = zonePenetration(pt, z, vw, vh);
    if (p <= 0) continue;
    const w = lerp(1, z.weight, p);
    if (w < weight) { weight = w; hit = z.id; }
  }
  return { weight, zoneId: hit };
}

function computeIntent(g, cfg, now) {
  if (g.scrollLocked) return 0;
  if (g.zoneWeight <= 0.001) return 0;
  const holdMs = lerp(cfg.holdMsMax, cfg.holdMsMin, g.zoneWeight);
  const elapsed = Math.max(0, (g.endTime ?? now) - g.startTime);
  const hold = clamp(elapsed / Math.max(1, holdMs), 0, 1);
  const dx = g.x - g.startX, dy = g.y - g.startY;
  const eff = Math.hypot(dx, dy * cfg.verticalDragWeight);
  const drag = clamp((eff - cfg.dragDeadzonePx) / (cfg.dragFullPx - cfg.dragDeadzonePx), 0, 1);
  return clamp(Math.max(hold, drag * g.zoneWeight), 0, 1);
}

function isTap(g, cfg) {
  if (!g.startTime) return false;
  const dur = Math.max(0, (g.endTime ?? g.lastTime) - g.startTime);
  const move = Math.hypot(g.x - g.startX, g.y - g.startY);
  return dur <= cfg.tapMaxMs && move <= cfg.tapMaxMovePx;
}

function groupByRow(items) {
  if (!items.length) return [];
  const valid = items.filter(it => it && it.rect && Number.isFinite(it.rect.top));
  if (!valid.length) return [];

  const sorted = [...valid].sort((a, b) => a.rect.top - b.rect.top);
  const rows = [];

  for (const it of sorted) {
    const itemHeight = Math.max(1, it.rect.bottom - it.rect.top);
    let r = rows.find(row => {
      const overlap = Math.min(row.bottom, it.rect.bottom) - Math.max(row.top, it.rect.top);
      return overlap > itemHeight * 0.2;
    });

    if (!r) {
      r = { top: it.rect.top, bottom: it.rect.bottom, items: [] };
      rows.push(r);
    }
    r.items.push(it);
    r.top = Math.min(r.top, it.rect.top);
    r.bottom = Math.max(r.bottom, it.rect.bottom);
  }

  for (const r of rows) {
    r.items.sort((a, b) => (a.rect.left + (a.rect.right - a.rect.left) / 2) - (b.rect.left + (b.rect.right - b.rect.left) / 2));
    r.height = Math.max(1, r.bottom - r.top);
  }
  return rows;
}

function resolveScreen(items, vw, vh, cfg) {
  if (!items.length) return [];
  const safeVh = Math.max(1, vh);
  const anchorY = safeVh * cfg.anchorRatio;
  const band = Math.max(1, safeVh * cfg.bandRatio);
  const rows = groupByRow(items);
  const out = [];

  for (const row of rows) {
    const N = row.items.length;
    const v = clamp((anchorY - row.top) / Math.max(1, row.height), 0, 1);
    const sliceWidth = 1 / N;

    row.items.forEach((it, colIdx) => {
      const cy = it.rect.top + (it.rect.bottom - it.rect.top) / 2;
      const d = Math.abs(cy - anchorY);
      const baseStrength = smooth(1 - d / band);
      if (baseStrength <= 0.001) return;

      let colWeight = 1.0;
      if (N > 1 && (cfg.rowSplit ?? 0) > 0) {
        const colCenter = (colIdx + 0.5) * sliceWidth;
        const distFromCenter = Math.abs(v - colCenter);
        const splitStrength = clamp(1 - (distFromCenter / sliceWidth), 0, 1);
        colWeight = lerp(1.0, splitStrength, cfg.rowSplit);
      }

      const finalStrength = baseStrength * colWeight;
      if (finalStrength > 0.001) {
        out.push({ id: it.id, strength: finalStrength, source: 'screen' });
      }
    });
  }
  return out;
}

function getHitUnderPoint(point, items, cfg) {
  if (!point || !items.length) return null;
  const valid = items.filter(it => it && it.rect && Number.isFinite(it.rect.left));
  if (!valid.length) return null;

  const hit = valid.find(it => {
    const r = it.rect;
    const minX = Math.min(r.left, r.right);
    const maxX = Math.max(r.left, r.right);
    const minY = Math.min(r.top, r.bottom);
    const maxY = Math.max(r.top, r.bottom);
    return point.x >= minX && point.x <= maxX && point.y >= minY && point.y <= maxY;
  });
  if (hit) return hit.id;

  const dists = valid.map(it => ({
    id: it.id,
    d: distToRect(point, it.rect)
  })).sort((a, b) => a.d - b.d);

  const closest = dists[0];
  const second = dists[1];
  const outerFalloff = Math.max(0, cfg.outerFalloffPx ?? 42);
  const inBetweenRatio = clamp(cfg.inBetweenRatio ?? 0.40, 0, 1);

  let effectiveFalloff = outerFalloff;
  if (second) {
    const gapSpan = closest.d + second.d;
    const gapAllowance = (gapSpan / 2) * inBetweenRatio;
    effectiveFalloff = Math.min(outerFalloff, gapAllowance);
  }

  if (closest.d <= effectiveFalloff) {
    return closest.id;
  }
  return null;
}

function arbitrate({ screenHits, touchHit, authority, modes }) {
  const map = new Map();
  const safeAuthority = clamp(authority, 0, 1);
  const add = (h, mul) => {
    if (!h) return;
    const s = h.strength * mul;
    if (s <= 0.001) return;
    const prev = map.get(h.id);
    if (!prev || s > prev.strength) map.set(h.id, { ...h, strength: s });
  };
  if (modes.screen) screenHits.forEach(h => add(h, modes.touch ? 1 - safeAuthority : 1));
  if (modes.touch) add(touchHit, safeAuthority);
  return [...map.values()].sort((a, b) => b.strength - a.strength);
}

/* ============================================================================
   React Adapter Hook with Persistent Stable Handlers
   ==========================================================================*/

const newGesture = () => ({
  phase: 'idle',
  startX: 0, startY: 0, x: 0, y: 0,
  startTime: 0, lastTime: 0, endTime: null,
  zoneWeight: 1, zoneId: null,
  scrollLocked: false,
  down: false,
});

function useHoverSenseLab({ registry, cfg, modes, enabled }) {
  const g = useRef(newGesture());
  const latch = useRef(null);
  const scrollAtLatch = useRef(0);
  const [out, setOut] = useState({ hits: [], dbg: {} });
  const publish = useRef({ key: '' });

  // Store cfg and modes in refs so event listeners remain attached without tearing down during slider drag
  const cfgRef = useRef(cfg);
  const modesRef = useRef(modes);
  cfgRef.current = cfg;
  modesRef.current = modes;

  useEffect(() => {
    const stage = document.getElementById('stage');
    if (!stage) return;
    const vw = () => window.innerWidth, vh = () => window.innerHeight;

    const down = (e) => {
      const currentCfg = cfgRef.current;
      const items = [];
      registry.current.forEach((el, id) => { if (el) items.push({ id, rect: el.getBoundingClientRect() }); });
      const hitId = getHitUnderPoint({ x: e.clientX, y: e.clientY }, items, currentCfg.touch);
      const isTargetHit = hitId !== null;

      const z = isTargetHit 
        ? { weight: 1, zoneId: null }
        : sampleZones({ x: e.clientX, y: e.clientY }, currentCfg.safeZones, vw(), vh());

      g.current = {
        ...newGesture(),
        phase: 'probing', down: true,
        startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY,
        startTime: performance.now(), lastTime: performance.now(),
        zoneWeight: z.weight, zoneId: z.zoneId,
      };
    };

    const move = (e) => {
      const currentCfg = cfgRef.current;
      const c = g.current;
      if (!c.down) return;
      c.x = e.clientX; c.y = e.clientY; c.lastTime = performance.now();
      if (c.phase === 'probing' && !c.scrollLocked) {
        const dt = c.lastTime - c.startTime;
        const dx = Math.abs(c.x - c.startX), dy = Math.abs(c.y - c.startY);
        if (dt <= currentCfg.touch.scrollLockGraceMs &&
            dy > currentCfg.touch.dragDeadzonePx &&
            dy > dx * currentCfg.touch.scrollLockAxisRatio) {
          c.scrollLocked = true;
        }
      }
    };

    const up = () => {
      const currentCfg = cfgRef.current;
      const c = g.current;
      if (!c.down) return;
      c.down = false;
      c.endTime = performance.now();
      if (c.phase === 'engaged') {
        scrollAtLatch.current = window.scrollY;
      } else if (isTap(c, currentCfg.touch)) {
        if (currentCfg.touch.clearLatchOnTap) latch.current = null;
      }
      c.phase = 'idle';
    };

    stage.addEventListener('pointerdown', down, { passive: true });
    window.addEventListener('pointermove', move, { passive: true });
    window.addEventListener('pointerup', up, { passive: true });
    window.addEventListener('pointercancel', up, { passive: true });
    return () => {
      stage.removeEventListener('pointerdown', down);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
  }, [registry]);

  useEffect(() => {
    if (!modes.touch) {
      latch.current = null;
      g.current = newGesture();
    }
  }, [modes.touch]);

  useEffect(() => {
    if (!enabled) return;
    let raf = 0;
    const tick = () => {
      raf = requestAnimationFrame(tick);
      const now = performance.now();
      const vw = window.innerWidth, vh = window.innerHeight;
      const c = g.current;
      const currentCfg = cfgRef.current;
      const currentModes = modesRef.current;

      const intent = (c.phase === 'probing' || c.phase === 'engaged')
        ? computeIntent(c, currentCfg.touch, now) : 0;

      if (c.phase === 'probing' && intent >= currentCfg.touch.engageAt) {
        c.phase = 'engaged';
        const items = [];
        registry.current.forEach((el, id) => { if (el) items.push({ id, rect: el.getBoundingClientRect() }); });
        const hitId = getHitUnderPoint({ x: c.startX, y: c.startY }, items, currentCfg.touch);
        latch.current = { id: hitId, x: c.startX, y: c.startY };
        scrollAtLatch.current = window.scrollY;
      }
      if (c.phase === 'engaged' && c.down) {
        scrollAtLatch.current = window.scrollY;
      }

      let authority = 0;
      if (latch.current && currentModes.touch) {
        if (currentCfg.arbitration.releaseMode === 'scroll') {
          const d = Math.abs(window.scrollY - scrollAtLatch.current);
          const a = 1 - smooth((d - currentCfg.arbitration.takeoverStartPx) /
            Math.max(1, currentCfg.arbitration.takeoverFullPx - currentCfg.arbitration.takeoverStartPx));
          authority = clamp(a, 0, 1);
        } else if (currentCfg.arbitration.releaseMode === 'off-screen') {
          if (latch.current.id && registry.current.has(latch.current.id)) {
            const el = registry.current.get(latch.current.id);
            const r = el.getBoundingClientRect();
            if (r.bottom < 0 || r.top > vh || r.right < 0 || r.left > vw) {
              authority = 0; 
            } else {
              authority = 1;
            }
          } else {
            const d = Math.abs(window.scrollY - scrollAtLatch.current);
            authority = d > currentCfg.arbitration.takeoverStartPx ? 0 : 1;
          }
        } else {
          authority = 1;
        }
        if (authority <= 0.001) latch.current = null;
      }

      const items = [];
      registry.current.forEach((el, id) => { if (el) items.push({ id, rect: el.getBoundingClientRect() }); });

      const screenHits = currentModes.screen ? resolveScreen(items, vw, vh, currentCfg.screen) : [];
      const touchHit = latch.current && latch.current.id 
          ? { id: latch.current.id, strength: 1, source: 'touch' } 
          : null;
      const hits = arbitrate({ screenHits, touchHit, authority, modes: currentModes });

      const dbg = {
        phase: c.phase, intent, authority, pointer: { x: c.x, y: c.y },
        zoneWeight: c.zoneWeight, zoneId: c.zoneId, scrollLocked: c.scrollLocked,
        holdMs: Math.round(lerp(currentCfg.touch.holdMsMax, currentCfg.touch.holdMsMin, c.zoneWeight)),
        elapsed: c.startTime ? Math.round(((c.endTime ?? now) - c.startTime)) : 0,
        latch: latch.current, scrollY: Math.round(window.scrollY),
        takeover: latch.current ? Math.round(Math.abs(window.scrollY - scrollAtLatch.current)) : 0,
      };

      const key = hits.map(h => h.id + ':' + h.source + ':' + Math.round(h.strength * 40)).join('|')
        + '#' + dbg.phase + Math.round(intent * 20) + Math.round(authority * 20)
        + (dbg.latch ? (dbg.latch.id ?? 'empty') + ',' + Math.round(dbg.latch.x) + ',' + Math.round(dbg.latch.y) : '-')
        + dbg.scrollY + dbg.zoneId + (dbg.phase === 'probing' ? Math.round(c.x/5) + ',' + Math.round(c.y/5) : '');
      
      if (key !== publish.current.key) {
        publish.current.key = key;
        setOut({ hits, dbg });
      }
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [enabled, registry]);

  return out;
}

/* ============================================================================

const LAYOUTS = {
  list:   { label:'1 x 10',     resolve:'all', defaultSplit: 0.0, n:10 },
  offset: { label:'2 x 5 offset', resolve:'all', defaultSplit: 1.0, n:10 },
  grid:   { label:'3 x 3',      resolve:'all', defaultSplit: 1.0, n:9  },
};

const TUNING_EXPLANATIONS = {
  anchorRatio: {
    title: 'Anchor Height',
    desc: 'The horizontal line of sight (fraction of screen height). Content crossing this line highlights during scrolling.',
    fmt: v => v.toFixed(2) + ' vh'
  },
  bandRatio: {
    title: 'Falloff Band Radius',
    desc: 'How far above and below the anchor line items start glowing. Wider values produce softer crossfades across neighbors.',
    fmt: v => v.toFixed(2) + ' vh'
  },
  rowSplit: {
    title: 'In-Row Column Split',
    desc: '0% hovers all columns together. 100% staggers columns individually based on vertical scroll position. Recommended 100% for 2x5 and 3x3.',
    fmt: v => v === 0 ? '0% (all together)' : (v * 100).toFixed(0) + '%'
  },
  holdMsMin: {
    title: 'Min Hold Dwell Time',
    desc: 'How long you must rest your finger before touch hover engages. Safely below the 500ms phone long-press menu threshold.',
    fmt: v => v + ' ms'
  },
  engageAt: {
    title: 'Engage Threshold',
    desc: 'Accumulated intent score required to lock touch hover. 90% gives fluid, confident engagement.',
    fmt: v => (v * 100).toFixed(0) + '%'
  },
  outerFalloffPx: {
    title: 'Outer Margin Falloff',
    desc: 'Snap cushion outside item boundaries. Touching slightly outside a card still selects it fluidly.',
    fmt: v => v + ' px'
  },
  inBetweenRatio: {
    title: 'In-Between Gap Snap',
    desc: 'How much of the gap between cards belongs to edge snapping. The rest is deadzone space so you can tap empty areas to deselect.',
    fmt: v => (v * 100).toFixed(0) + '%'
  },
  takeoverFullPx: {
    title: 'Takeover Distance',
    desc: 'How far you must scroll before the passive screen channel takes back control from a locked touch.',
    fmt: v => v + ' px'
  },
  releaseMode: {
    title: 'Authority Release Mode',
    desc: 'How touch authority releases: "off-screen" drops only when the locked card scrolls out of view; "scroll" decays by distance.',
    fmt: v => v
  }
};

/**
 * Robust Custom Draggable Slider Component
 * Defined OUTSIDE App to guarantee continuous touch pointer dragging without re-mounting DOM nodes.
 */
function TouchSlider({ label, value, min, max, step, fmt, onChange, onDragStart, onDragEnd }) {
  const trackRef = useRef(null);
  const isDragging = useRef(false);

  const updateFromPointer = (clientX) => {
    if (!trackRef.current) return;
    const rect = trackRef.current.getBoundingClientRect();
    const ratio = clamp((clientX - rect.left) / rect.width, 0, 1);
    let rawVal = min + ratio * (max - min);
    if (step) {
      rawVal = Math.round((rawVal - min) / step) * step + min;
    }
    const finalVal = clamp(Number(rawVal.toFixed(4)), min, max);
    onChange(finalVal);
  };

  const handlePointerDown = (e) => {
    isDragging.current = true;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    updateFromPointer(e.clientX);
    if (onDragStart) onDragStart();
  };

  const handlePointerMove = (e) => {
    if (!isDragging.current) return;
    updateFromPointer(e.clientX);
  };

  const handlePointerUp = (e) => {
    if (isDragging.current) {
      isDragging.current = false;
      try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
      if (onDragEnd) onDragEnd();
    }
  };

  const pct = clamp(((value - min) / (max - min)) * 100, 0, 100);

  return (
    <div className="sl">
      <div className="sl-header">
        <span>{label}</span>
        <b className="mono">{fmt ? fmt(value) : value}</b>
      </div>
      <div
        ref={trackRef}
        className="custom-track"
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
        onPointerCancel={handlePointerUp}
      >
        <div className="custom-bar">
          <div className="custom-fill" style={{ width: `${pct}%` }} />
        </div>
        <div className="custom-thumb" style={{ left: `${pct}%` }} />
      </div>
    </div>
  );
}

function Card({ id, n, hit, bind, tall }) {
  const s = hit ? hit.strength : 0;
  const col = hit ? (hit.source === 'touch' ? 'var(--touch)' : 'var(--screen)') : 'var(--line)';
  return (
    <div
      ref={bind}
      className={'card' + (tall ? ' portrait' : '')}
      style={{
        borderColor: s > 0.02 ? col : 'var(--line)',
        transform: `scale(${1 + s * 0.038})`,
        boxShadow: s > 0.02 ? `0 4px 20px ${(s * 4).toFixed(1)}px color-mix(in srgb, ${col} ${Math.round(s * 50)}%, transparent)` : 'none',
      }}
    >
      <div className="bar" style={{ background: col, opacity: s }} />
      <div className="idx mono">{String(n).padStart(2, '0')}</div>
      <div className="meta mono">
        {hit ? `${hit.source} ${(s * 100).toFixed(0)}%` : 'idle'}
      </div>
    </div>
  );
}

function Stage({ layout, hitsById, registry }) {
  const bind = (id) => (el) => { if (el) registry.current.set(id, el); else registry.current.delete(id); };
  const mk = (i, tall) => <Card key={i} id={'c' + i} n={i + 1} tall={tall} hit={hitsById.get('c' + i)} bind={bind('c' + i)} />;

  if (layout === 'list') {
    return <div className="stack">{Array.from({ length: 10 }, (_, i) => mk(i))}</div>;
  }
  if (layout === 'offset') {
    return (
      <div className="cols">
        <div className="col" style={{ marginTop: 0 }}>{[0, 2, 4, 6, 8].map(i => mk(i, true))}</div>
        <div className="col" style={{ marginTop: 78 }}>{[1, 3, 5, 7, 9].map(i => mk(i, true))}</div>
      </div>
    );
  }
  return <div className="grid3">{Array.from({ length: 9 }, (_, i) => mk(i))}</div>;
}

function App() {
  const registry = useRef(new Map());
  const [layout, setLayout] = useState('list');
  const [modes, setModes] = useState({ screen: true, touch: true });
  const [showZones, setShowZones] = useState(true);
  const [showGuide, setShowGuide] = useState(false);
  const [activeReadout, setActiveReadout] = useState(null);
  const readoutTimer = useRef(null);

  const [tune, setTune] = useState({
    anchorRatio: DEFAULTS.screen.anchorRatio,
    bandRatio: DEFAULTS.screen.bandRatio,
    rowSplit: DEFAULTS.screen.rowSplit,
    holdMsMin: DEFAULTS.touch.holdMsMin,
    engageAt: DEFAULTS.touch.engageAt, // 90% recommended default
    outerFalloffPx: DEFAULTS.touch.outerFalloffPx,
    inBetweenRatio: DEFAULTS.touch.inBetweenRatio,
    takeoverFullPx: DEFAULTS.arbitration.takeoverFullPx,
    releaseMode: DEFAULTS.arbitration.releaseMode,
  });

  const selectLayout = (k) => {
    setLayout(k);
    const recSplit = LAYOUTS[k].defaultSplit;
    setTune(t => ({ ...t, rowSplit: recSplit }));
    triggerReadout('rowSplit', recSplit);
  };

  const cfg = useMemo(() => ({
    ...DEFAULTS,
    screen: { ...DEFAULTS.screen, resolve: LAYOUTS[layout].resolve, anchorRatio: tune.anchorRatio, bandRatio: tune.bandRatio, rowSplit: tune.rowSplit },
    touch: { ...DEFAULTS.touch, holdMsMin: tune.holdMsMin, engageAt: tune.engageAt, outerFalloffPx: tune.outerFalloffPx, inBetweenRatio: tune.inBetweenRatio },
    arbitration: { ...DEFAULTS.arbitration, takeoverFullPx: tune.takeoverFullPx, releaseMode: tune.releaseMode },
  }), [layout, tune]);

  useEffect(() => { registry.current.clear(); }, [layout]);

  const { hits, dbg } = useHoverSenseLab({ registry, cfg, modes, enabled: true });
  const hitsById = useMemo(() => new Map(hits.map(h => [h.id, h])), [hits]);

  const vh = window.innerHeight, vw = window.innerWidth;
  const anchorY = vh * cfg.screen.anchorRatio;
  const bandPx = vh * cfg.screen.bandRatio;

  const triggerReadout = useCallback((key, val) => {
    const meta = TUNING_EXPLANATIONS[key];
    if (!meta) return;
    setActiveReadout({
      key,
      title: meta.title,
      value: meta.fmt ? meta.fmt(val) : String(val),
      desc: meta.desc,
    });
    if (readoutTimer.current) clearTimeout(readoutTimer.current);
    readoutTimer.current = setTimeout(() => {
      setActiveReadout(null);
    }, 1400);
  }, []);

  return (
    <>
      {/* Center-of-Screen Floating Readout (Never obscured by fingers!) */}
      {activeReadout && (
        <div className="center-readout">
          <div className="cr-title mono">{activeReadout.title}</div>
          <div className="cr-val mono">{activeReadout.value}</div>
          <div className="cr-desc">{activeReadout.desc}</div>
        </div>
      )}

      {/* Guide & English Tuning Explanations Modal */}
      {showGuide && (
        <div className="modal-backdrop" onClick={() => setShowGuide(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <h2>HoverSense Tuning Guide</h2>
            <p>
              HoverSense brings pointerless spatial hover to touchscreens.
              You can customize every physical threshold in the bottom dock to match your app.
            </p>

            <div className="guide-note">
              <strong>Notice on Safe Zones:</strong> Safe zones are safety overreach as of now.
              They are conservative buffers at the screen edges and bottom thumb region designed to suppress accidental palm contact and bezel grips.
              You can toggle them off in the bottom dock to test raw touch behavior.
            </div>

            <div className="guide-grid">
              <div className="guide-item">
                <b>Anchor Height (0.42 default)</b>
                Horizontal gaze line where content lights up as you scroll. 0.42 aligns with natural gaze above the thumb.
              </div>
              <div className="guide-item">
                <b>Falloff Band Radius (0.30 default)</b>
                Vertical distance around the anchor line where proximity glow ramps in.
              </div>
              <div className="guide-item">
                <b>In-Row Split (100% recommended for grids)</b>
                For 2x5 and 3x3 layouts, staggers columns individually as you scroll so cards crossfade one by one.
              </div>
              <div className="guide-item">
                <b>Min Hold Time (320ms default)</b>
                How long a finger must dwell to engage hover. Safely under the 500ms phone long-press menu.
              </div>
              <div className="guide-item">
                <b>Engage Threshold (90% recommended)</b>
                Required confidence score to lock touch hover state.
              </div>
              <div className="guide-item">
                <b>Outer Falloff & In-Between Gap</b>
                Determines snap cushioning around cards and leaves empty deadzones in gutters to cleanly tap-to-deselect.
              </div>
              <div className="guide-item">
                <b>Scroll Takeover Distance (560px default)</b>
                How far you scroll before the passive screen channel takes back control from a locked card.
              </div>
            </div>

            <button className="btn-close" onClick={() => setShowGuide(false)}>
              Got it, let us explore!
            </button>
          </div>
        </div>
      )}

      {/* Overlays */}
      {modes.screen && (
        <>
          <div className="band" style={{
            top: anchorY - bandPx, height: bandPx * 2,
            background: `linear-gradient(to bottom, transparent, color-mix(in srgb, var(--screen) 14%, transparent), transparent)`
          }} />
          <div className="anchor" style={{ top: anchorY }}><span className="mono">anchor {cfg.screen.anchorRatio.toFixed(2)}</span></div>
        </>
      )}
      {showZones && modes.touch && cfg.safeZones.map(z => {
        const f = z.featherPx;
        return (
          <div key={z.id} className="zone" style={{
            left: z.left * vw, top: z.top * vh,
            width: (z.right - z.left) * vw, height: (z.bottom - z.top) * vh,
            background: `color-mix(in srgb, var(--dead) ${Math.round((1 - z.weight) * 22)}%, transparent)`,
            boxShadow: `inset 0 0 ${f}px ${f / 2}px color-mix(in srgb, var(--dead) ${Math.round((1 - z.weight) * 16)}%, transparent)`,
          }} />
        );
      })}

      {/* SVG Progress Timer & Touch Indicator */}
      {modes.touch && (dbg.phase === 'probing' || dbg.latch) && (
        <div style={{
          position: 'fixed', zIndex: 9999, pointerEvents: 'none',
          left: dbg.phase === 'probing' ? dbg.pointer?.x : dbg.latch?.x,
          top: dbg.phase === 'probing' ? dbg.pointer?.y : dbg.latch?.y,
          transform: 'translate(-50%, -50%)'
        }}>
          {dbg.phase === 'probing' && !dbg.scrollLocked && dbg.intent > 0 && (
            <svg width="40" height="40" viewBox="0 0 40 40" style={{ transform: 'rotate(-90deg)', overflow: 'visible' }}>
              <circle cx="20" cy="20" r="16" fill="none" stroke="var(--touch)" strokeWidth="3"
                strokeDasharray="100" strokeDashoffset={100 - (dbg.intent * 100)} opacity="0.85" />
            </svg>
          )}
          {dbg.latch && (
            <div className="dot" style={{
              position: 'relative', left: 'auto', top: 'auto', margin: 0,
              opacity: dbg.latch.id ? (0.25 + dbg.authority * 0.75) : 0.4,
              borderColor: dbg.latch.id ? 'var(--touch)' : 'var(--dead)',
              borderStyle: dbg.latch.id ? 'solid' : 'dashed',
            }}>
              {dbg.latch.id && <i />}
            </div>
          )}
        </div>
      )}

      {/* HUD Header */}
      <div className="hud">
        <div className="hud-row mono">
          <span className="kv"><b>system</b>HoverSense</span>
          <span className="kv"><b>phase</b>{dbg.phase}</span>
          <span className="kv"><b>intent</b>{(dbg.intent ?? 0).toFixed(2)}</span>
          <span className="kv"><b>authority</b>{(dbg.authority ?? 0).toFixed(2)}</span>
          <span className="kv"><b>zone</b>{(dbg.zoneWeight ?? 1).toFixed(2)}{dbg.zoneId ? ' ' + dbg.zoneId : ''}</span>
          <span className="kv"><b>hold</b>{dbg.elapsed}/{dbg.holdMs}ms</span>
          <span className="kv"><b>scroll-lock</b>{dbg.scrollLocked ? 'yes' : 'no'}</span>
          <span className="kv"><b>takeover</b>{cfg.arbitration.releaseMode === 'scroll' ? dbg.takeover + 'px' : cfg.arbitration.releaseMode}</span>
          <span className="kv"><b>hover</b>{hits.length ? hits.map(h => h.id + ':' + h.source).join(' ') : 'none (deselected)'}</span>
          <a href="./playground/" style={{ color: 'var(--accent)', textDecoration: 'none', fontWeight: 600, border: '1px solid var(--accent)', padding: '2px 8px', borderRadius: 6, marginLeft: 'auto' }}>⚡ DX Playground →</a>
        </div>
      </div>

      {/* Stage Container */}
      <div id="stage" style={{ paddingTop: 96 }}>
        <Stage layout={layout} hitsById={hitsById} registry={registry} />
      </div>

      {/* Bottom Control Dock */}
      <div className="dock">
        <div className="btnrow">
          <button className="ch-screen" data-on={modes.screen ? 1 : 0}
            onClick={() => setModes(m => ({ ...m, screen: !m.screen }))}>Screen channel</button>
          <button className="ch-touch" data-on={modes.touch ? 1 : 0}
            onClick={() => setModes(m => ({ ...m, touch: !m.touch }))}>Touch channel</button>
          {Object.entries(LAYOUTS).map(([k, v]) => (
            <button key={k} data-on={layout === k ? 1 : 0} onClick={() => selectLayout(k)}>{v.label}</button>
          ))}
          <button data-on={showZones ? 1 : 0} onClick={() => setShowZones(s => !s)}>Safe zones</button>
          <button className="btn-guide" onClick={() => setShowGuide(true)}>Guide & Tuning</button>
        </div>
        <details open>
          <summary>Fine-Tuning & Biomechanical Controls (Smooth Continuous Drag)</summary>
          <div className="sliders">
            <TouchSlider
              label="anchor ratio"
              value={tune.anchorRatio}
              min={0.15}
              max={0.85}
              step={0.01}
              fmt={v => v.toFixed(2)}
              onChange={val => { setTune(t => ({ ...t, anchorRatio: val })); triggerReadout('anchorRatio', val); }}
            />
            <TouchSlider
              label="falloff band"
              value={tune.bandRatio}
              min={0.08}
              max={0.80}
              step={0.01}
              fmt={v => v.toFixed(2)}
              onChange={val => { setTune(t => ({ ...t, bandRatio: val })); triggerReadout('bandRatio', val); }}
            />
            <TouchSlider
              label="in-row split"
              value={tune.rowSplit}
              min={0}
              max={1}
              step={0.05}
              fmt={v => v === 0 ? '0% (together)' : (v*100).toFixed(0) + '%'}
              onChange={val => { setTune(t => ({ ...t, rowSplit: val })); triggerReadout('rowSplit', val); }}
            />
            <TouchSlider
              label="min hold"
              value={tune.holdMsMin}
              min={120}
              max={900}
              step={10}
              fmt={v => v + 'ms'}
              onChange={val => { setTune(t => ({ ...t, holdMsMin: val })); triggerReadout('holdMsMin', val); }}
            />
            <TouchSlider
              label="engage at"
              value={tune.engageAt}
              min={0.20}
              max={1.00}
              step={0.05}
              fmt={v => (v*100).toFixed(0) + '%'}
              onChange={val => { setTune(t => ({ ...t, engageAt: val })); triggerReadout('engageAt', val); }}
            />
            <TouchSlider
              label="outer falloff"
              value={tune.outerFalloffPx}
              min={0}
              max={150}
              step={2}
              fmt={v => v + 'px'}
              onChange={val => { setTune(t => ({ ...t, outerFalloffPx: val })); triggerReadout('outerFalloffPx', val); }}
            />
            <TouchSlider
              label="in-between gap"
              value={tune.inBetweenRatio}
              min={0}
              max={1}
              step={0.05}
              fmt={v => (v*100).toFixed(0) + '%'}
              onChange={val => { setTune(t => ({ ...t, inBetweenRatio: val })); triggerReadout('inBetweenRatio', val); }}
            />
            <TouchSlider
              label="takeover dist"
              value={tune.takeoverFullPx}
              min={200}
              max={1600}
              step={20}
              fmt={v => v + 'px'}
              onChange={val => { setTune(t => ({ ...t, takeoverFullPx: val })); triggerReadout('takeoverFullPx', val); }}
            />
            <label className="sl">
              <div className="sl-header">
                <span>release mode</span>
                <b className="mono">{tune.releaseMode}</b>
              </div>
              <select
                style={{width:'100%', background:'transparent', color:'inherit', border:'1px solid var(--line)', padding:'4px', fontSize:'11px', borderRadius:'6px', height:'28px'}}
                value={tune.releaseMode}
                onChange={e => {
                  const val = e.target.value;
                  setTune(t => ({...t, releaseMode: val}));
                  triggerReadout('releaseMode', val);
                }}
              >
                <option value="off-screen" style={{background: 'var(--bg)'}}>Off-screen (leaves view)</option>
                <option value="scroll" style={{background: 'var(--bg)'}}>Scroll distance</option>
                <option value="never" style={{background: 'var(--bg)'}}>Never</option>
              </select>
            </label>
          </div>
        </details>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
